server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  # Configure the exact deployed API origin in connect-src when using containers.
  # Widget-only public token is browser-side; the account Authkey is NOT.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://verify.msg91.com https://verify.phone91.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 https://api.msg91.com https://control.msg91.com https://api.phone91.com https://control.phone91.com; frame-src https://verify.msg91.com https://verify.phone91.com" always;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
