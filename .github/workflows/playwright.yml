name: Playwright KYC E2E

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  kyc-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-isolated-admin-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      E2E_ALLOWED_DATABASE_HOSTS: 127.0.0.1
      E2E_WEB_URL: http://127.0.0.1:5173
      E2E_API_URL: http://127.0.0.1:8000/api/v1
      E2E_CONTROL_TOKEN: ci-e2e-control-token-not-production
      E2E_PROVIDER_EMAIL: provider.e2e@example.com
      E2E_PROVIDER_PASSWORD: ProviderE2E123!
      E2E_ADMIN_EMAIL: admin.e2e@example.com
      E2E_ADMIN_PASSWORD: AdminE2E123!Secure
      E2E_PYTHON: python
      ENABLE_LEGACY_PROVIDER_MARKETPLACE: 'true'
      ENABLE_TRANSPORT_PAYMENT_COLLECTION: 'true'
      ENABLE_PROVIDER_FIRST_PUBLICATION: 'true'
      VITE_LEGACY_PROVIDER_MARKETPLACE: 'true'
      CUSTOMER_KYC_TEST_SIMULATION: 'true'
      APP_ENV: test
      TRANSIVOX_E2E: 'true'
      E2E_REAL_AWS: 'false'
      DATABASE_URL: postgresql+psycopg://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      MIGRATION_DATABASE_URL: postgresql+psycopg://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      SECRET_KEY: ci-e2e-only-not-for-production-012345678901234567890123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend and test dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Provision isolated least-privilege test database
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ci-isolated-admin-only
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE transivox_e2e_user LOGIN PASSWORD 'e2e-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE transivox_e2e OWNER transivox_e2e_user;"
          psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE postgres FROM PUBLIC; REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;"
      - name: Apply real migrations in isolated database
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Check PostgreSQL serialization and rejection persistence
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/integration -q
      - name: Run deterministic KYC journey
        run: npm run e2e:kyc
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-kyc-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Verify customer-first demand, fee and session journeys
        run: npx playwright test --config playwright.demand.config.ts --project=chromium

      - name: Verify configured customer KYC and demand management
        run: npx playwright test --config playwright.journeys.config.ts --project=chromium
      - name: Verify Maps simulated failure and pin workflows
        run: npx playwright test --config playwright.maps.config.ts
      - name: Verify email link UI with simulated account responses
        run: npx playwright test --config playwright.email.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-customer-release-reports
          path: |
            playwright-report-demand/
            playwright-report-journeys/
            playwright-report-maps/
          retention-days: 14
