name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-isolated-admin-only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      MIGRATION_DATABASE_URL: postgresql+psycopg://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      E2E_DATABASE_URL: postgresql://transivox_e2e_user:e2e-only-password@127.0.0.1:5432/transivox_e2e
      E2E_ALLOWED_DATABASE_HOSTS: 127.0.0.1
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-long-random-secret-not-for-production
      APP_ENV: test
      TRANSIVOX_E2E: 'true'
      E2E_REAL_AWS: 'false'
      E2E_CONTROL_TOKEN: ci-local-support-not-production
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Provision dedicated least-privilege E2E database
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ci-isolated-admin-only
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE transivox_e2e_user LOGIN PASSWORD 'e2e-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE transivox_e2e OWNER transivox_e2e_user;"
          psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE postgres FROM PUBLIC; REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;"
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check app tests migrations
        working-directory: backend
      - run: mypy app/domain.py
        working-directory: backend
      - run: pytest --ignore=tests/integration --cov=app --cov-report=xml
        working-directory: backend
      - run: pytest tests/integration -q
        working-directory: backend
        env:
          PILOT_E2E_DATABASE: '1'
  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
