name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: trucksetu, POSTGRES_PASSWORD: test-password, POSTGRES_DB: trucksetu_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://trucksetu:test-password@localhost:5432/trucksetu_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-long-random-secret-not-for-production
      APP_ENV: test
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check app tests migrations
        working-directory: backend
      - run: mypy app/domain.py
        working-directory: backend
      - run: pytest --cov=app --cov-report=xml
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
