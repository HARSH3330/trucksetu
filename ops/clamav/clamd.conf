Foreground yes
LocalSocket /tmp/transivox-clamd.sock
LocalSocketMode 600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 1
MaxQueue 2
MaxFileSize 10M
MaxScanSize 40M
MaxFiles 100
MaxRecursion 8
MaxScanTime 45000
AlertEncrypted yes
AlertExceedsMax yes
StreamMaxLength 10M
ReadTimeout 60
CommandReadTimeout 10
SendBufTimeout 1000
LogTime no
LogClean no
LogVerbose no
SelfCheck 600
